<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#04101d" />
  <meta name="description" content="Sharkquarium — a browser-based canvas game scaffold." />
  <title>Sharkquarium</title>
  <link rel="stylesheet" href="./styles/main.css" data-inline />
</head>
<body>
  <main class="stage">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Sharkquarium game canvas">Your browser does not support the canvas element.</canvas>
    <noscript>Sharkquarium needs JavaScript enabled to run.</noscript>
  </main>
  <script type="module" src="./src/main.js" data-inline></script>
</body>
</html>
